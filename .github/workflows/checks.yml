name: Checks
on:
  pull_request:
  push:
    branches: [main, agent-testing]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run agent:eval
